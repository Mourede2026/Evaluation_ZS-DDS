<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Formulaire intrants</title>
<style>:root{--n:#12314f;--t:#0f8b8d}*{box-sizing:border-box}body{font-family:system-ui,sans-serif;margin:0;background:#f3f6f9;color:#1b2733}header{background:var(--n);color:#fff;padding:12px 14px}h1{font-size:1.05rem;margin:0}.c{background:#fff;margin:10px;padding:12px;border-radius:10px;box-shadow:0 1px 3px #0002}label{display:block;font-size:.85rem;margin:8px 0 0}input,select{width:100%;padding:8px;border:1px solid #b9c5d0;border-radius:6px;font-size:1rem}table{border-collapse:collapse;width:100%;font-size:.85rem}td,th{border-bottom:1px solid #e3e9ee;padding:4px;text-align:left}td input{padding:5px;min-width:78px}.w{overflow-x:auto}button{background:var(--t);color:#fff;border:0;border-radius:8px;padding:12px;font-size:1rem;width:100%}#m{margin:10px;padding:10px;border-radius:8px;display:none}.ok{background:#e1f5e9;color:#0a6b35}.er{background:#fde8e8;color:#a11}</style></head><body>
<header><h1>Formulaire intrants — Zone sanitaire</h1></header>
<div class="c" id="lg"><b>Connexion</b><label>Identifiant<input id="lu" autocomplete="username"></label><label>Mot de passe<input id="lp" type="password" autocomplete="current-password"></label><p style="margin:10px 0 0"><button onclick="lgn()">Se connecter</button></p><p id="le" style="color:#a11;margin:8px 0 0"></p></div>
<div id="fm" style="display:none">
<div class="c"><label>Zone sanitaire<select id="z" onchange="zc()"><option value="">Chargement…</option></select></label><label id="zw" style="display:none">Nom de la zone sanitaire<input id="zt" placeholder="Saisir le nom exact"></label><label>Votre nom / structure<input id="by"></label></div>
<div class="c"><label>Rechercher un intrant<input id="q" oninput="fq()"></label></div>
<div class="c w"><table id="t"><tr><th>N°</th><th>Intrant</th><th>Stock dispo.</th><th>Péremption</th><th>Besoin exprimé</th></tr></table></div>
<div id="m"></div><div class="c"><button onclick="send()">Envoyer les données</button></div></div>
<script>
const API="https://script.google.com/macros/s/AKfycbzysa0atr-FDp-PZ5Oold5o2Jh-oMomHUjhgJ1dsf7OC87Ur3RTry0h2rnziASQJZPuog/exec",IN=["Alcool 70° (1 Litre)", "Amoxicilline 500mg comprimé", "Aquatabs", "Artesunate injectable 80 mg", "Bande velpeau", "Bétadine jaune 200 mL", "Bistourie", "Boîte petite chirugie", "Cathéter G18", "Cathéter G20", "Cathéter G22", "Cathéter G24", "Ceftriaxone injectable 1g", "Chlorpromazine injectable", "Cimétidine comprimé", "Compresse stérile (boîte)", "Coton hydrophile 500 g", "Dakin", "Diazépam injectable", "Doxycycline cp", "Eau de javel (1L)", "Eau minéral (1,5L)", "Eau oxygenée", "Equipement de protection individuelle (EPI) kit complet", "Exacyl injectable", "Fil de suture", "Fumarate ferreux comprimé", "Gant d'examen stérile (boite de 100)", "Gant latex non stérile (boite de 100)", "Gants d’examen (boîte de 100)", "Gasviscon", "Gel hydro-alcoolique de table 500 ml", "Gentamycine collyre", "Hypochlorite de calcium (grand pot)", "Ions (Kcl)", "Ions (Nacl", "Ions Calcium", "Ions Potassium", "Lunettes de protection  réutilisables", "Masque FFP2 ou protège visage", "Métoclopramide", "Métoclopramide injectable", "Métronidazol comprimé 250mg", "Métronidazol injectable 500mg", "Morphine injectable", "Multivitamine comprimé", "Oméprazole comprimé", "Oracel zinc", "Orasel zinc (boîte)", "Papier kraft (rouleau)", "Paracétamol comprimé 500mg", "Paracétamol injectable 1g", "Perfalgan injectable", "Perfuseur", "Piles pour appareil de distribution de gel et mégaphone (grande)", "Piles pour thermomètre infra rouge / laser (petite pile)", "Prométhazine injectable", "Ribavirine ampoule injectable", "Ribavirine comprimes (nombre comprimé)", "Ringer lactate 500 ml", "Sac mortuaire", "Savon liquide (1L)", "Savon plamida", "Seringue 10 ml", "Seringue 20 ml", "Seringue 5 ml", "Seringue 50 ml", "Sérum glocosé 10% 500 ml", "Sérum salé 500ml", "Sparadrap (boîte)", "Test de dépistage Rapide choléra (TDR choléra)", "Thermomètre infra rouge", "Tramadol injectable", "Tramadol injectable", "Trisilicate de magnésium injectable", "Tulle gras", "Vitamine A", "Vitamine B1 injectable", "Vitamine K injectable", "Amoxicilline + Acide clavulanique 1g inj", "Auréomycine pde ophtalmique", "Bicarbonate de soude poudre (Boîte de 250 g)", "Brulex pommade", "Dacryoserum Boîte", "Eludril bain de bouche (Boîte)", "Éosine aqueuse 2% (Boîte de 60 CC)", "Gentamycine 80mg inj", "Morphine inj 10mg/ml", "Noradrénaline amp inj", "Oméprazole 20mg gel", "Smecta sachet bôite", "Técovirimat 200 MG gélule B/42", "Técovirimat 200 mg injectable", "Tramadol 100mg inj amp", "Vitamine c 1000 mg cp eff (boîte)", "Vitamine C 500 mg amp inj", "Xylocaine visqueuse 2% gel", "Kéfotax 1g", "Vancomycine 500mg", "Dermobacter solution"];
const $=id=>document.getElementById(id);let D={};try{D=JSON.parse(localStorage.getItem('intrDraft')||'{}')}catch(x){}
const sd=()=>{try{localStorage.setItem('intrDraft',JSON.stringify(D))}catch(x){}};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
$('t').insertAdjacentHTML('beforeend',IN.map((n,i)=>{const r=D[i]||{};return `<tr><td>${i+1}</td><td>${esc(n)}</td><td><input type="number" value="${esc(r.s)}" oninput="ci(${i},'s',this.value)"></td><td><input type="date" value="${esc(r.p)}" oninput="ci(${i},'p',this.value)"></td><td><input type="number" value="${esc(r.b)}" oninput="ci(${i},'b',this.value)"></td></tr>`}).join(''));
function ci(i,k,v){(D[i]=D[i]||{})[k]=v;sd()}
function fq(){const q=$('q').value.toLowerCase();document.querySelectorAll('#t tr:nth-child(n+2)').forEach(r=>r.style.display=r.children[1].textContent.toLowerCase().includes(q)?'':'none')}
function zc(){$('zw').style.display=$('z').value=='__autre'?'':'none'}
function msg(t,ok){const m=$('m');m.className=ok?'ok':'er';m.textContent=t;m.style.display='block';m.scrollIntoView({behavior:'smooth'})}
let U=null;try{U=JSON.parse(sessionStorage.getItem('intrU')||'null')}catch(x){}
const api=d=>fetch(API,{method:'POST',body:JSON.stringify(Object.assign({user:U&&U.user,token:U&&U.token},d))}).then(r=>r.json());
function show(){$('lg').style.display=U?'none':'';$('fm').style.display=U?'':'none';if(U)zl()}
async function lgn(){$('le').textContent='';try{const j=await fetch(API,{method:'POST',body:JSON.stringify({a:'login',user:$('lu').value.trim(),pass:$('lp').value})}).then(r=>r.json());if(!j.ok){$('le').textContent=j.err||'Erreur';return}U={user:$('lu').value.trim(),token:j.token};try{sessionStorage.setItem('intrU',JSON.stringify(U))}catch(x){}$('lp').value='';show()}catch(x){$('le').textContent='Connexion impossible : vérifiez le réseau.'}}
async function zl(){try{const j=await api({a:'zones'});if(!j.ok&&j.auth){U=null;sessionStorage.removeItem('intrU');show();return}const z=j.ok?j.zones:[];$('z').innerHTML='<option value="">— Choisir —</option>'+z.map(x=>`<option>${esc(x)}</option>`).join('')+'<option value="__autre">Autre (saisir le nom)</option>'}catch(x){$('z').innerHTML='<option value="__autre">Saisir le nom</option>';zc()}}
show();
async function send(){const zone=($('z').value=='__autre'?$('zt').value:$('z').value).trim();if(!zone){msg('Choisissez ou saisissez la zone sanitaire.');return}
const items={};Object.keys(D).forEach(i=>{const r=D[i];if(r&&(r.s||r.p||r.b))items[i]=r});if(!Object.keys(items).length){msg('Aucune donnée saisie.');return}
try{const j=await api({a:'intrSubmit',zone,by:$('by').value.trim(),items});if(j.auth){U=null;show();return}if(j.ok){msg('✔ Données envoyées pour la zone « '+zone+' ».',1);D={};sd()}else msg(j.err||'Erreur')}catch(x){msg('Connexion impossible : vos données sont conservées sur cet appareil, réessayez.')}}
</script></body></html>
