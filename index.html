<style>

button.p{background:var(--teal);border-color:var(--teal);color:#fff}button.d{color:var(--red)}
input,select{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:7px 8px;width:100%;font-size:14px}

.perf b{font-size:22px}.badge{padding:3px 9px;border-radius:12px;font-size:12px;font-weight:700;background:var(--amber)}.badge.ok{background:var(--gb);color:var(--grn)}
.obj{background:var(--navy2);color:#fff;border-radius:8px;padding:9px 12px;margin:14px 0 8px;font-size:13px;font-weight:700;display:flex;justify-content:space-between;gap:8px}

.ic.na{opacity:.55}.ic details{margin-top:8px;font-size:12px;color:var(--mut)}.ic summary{cursor:pointer;color:var(--navy2);font-weight:600}

.bar2{height:9px;background:var(--line);border-radius:5px;overflow:hidden;min-width:80px}.bar2 i{display:block;height:100%;background:var(--teal)}

<header><h1>Outil d’évaluation de la performance de la surveillance — Zone sanitaire / DDS</h1><p>ANSSP / DSER · édition 2026</p></header>

<nav class="tabs" id="tabs"></nav><main id="m"></main><div id="lg" style="display:none;position:fixed;inset:0;z-index:20;background:linear-gradient(135deg,#12314f,#1f4e78);align-items:center;justify-content:center;padding:20px"><div class="card" style="width:100%;max-width:380px"><h2 style="margin:0 0 4px;font-size:16px">Connexion</h2><p class="hint" style="margin:0 0 10px" id="lh">Utilisez le compte fourni par l’administrateur.</p><label>Identifiant<input id="lu" autocapitalize="none"></label><label style="margin-top:8px">Mot de passe<input id="lp" type="password"></label><p id="le" style="color:var(--red);font-size:12px;min-height:16px"></p><label id="lw" style="margin-top:8px;display:none">Confirmer le mot de passe<input id="lp2" type="password"></label><button class="p" style="width:100%;margin-top:6px" id="lb" onclick="login()">Se connecter</button><p style="text-align:center;margin:10px 0 0"><a href="#" onclick="tst();return false" style="font-size:.85rem">Tester le serveur</a></p></div></div>
<script>
const D={"ZS":{"obj":[{"o":"Objectif 1: Renforcer la capacité de détection précoce et de notification des maladies et évènements prioritaires y compris les décès à tous les niveaux y compris le niveau communautaire","i":[{"n":1,"t":"Proportion de foyers ou d'évènements investigués avec transmission des rapports dans les 72h après la notification","c":0.8,"p":5,"f":1,"r":"< 50% = 0\nEntre 50 et 79% = 2\n> 79% = 5","x":[["bt",50.0,79.0,2],["lt",50.0,0,0],["gt",79.0,0,5]],"e":"Numérateur:  Nombre de foyers ou d'évènements investigués avec rapports élaborés et transmis dans les 72h après la notification dans la période  \n-1) Vérifier d'abord le nombre de rapports d'investigation;  \n-2) voir si le contenu du rapport est conforme au canevas de l'ANSSP; \n-3) vérifier le respect du délai de tranmission à la DDS (voir les captures des mails d'envoi avec visualisation de date d'envoi, ou faire le point avec la DDS et voir si les dates d'envoi et de notification respectent les 72h. \n-Faire le point du nombre de rapports respectant ces 3 critères. NB: si les captures de mails ne sont pas disponibles mettre zéro; le SpotRep n'est pas un rapport d'investigation\nDénominateur: Nombre de foyers ou d'évènementase enregistrés (voir dans la base des événements)"},{"n":2,"t":"Proportion d’agents de santé formés ou briefés sur la SIMR et les événements","c":0.8,"p":5,"f":1,"r":"< 50% = 0\nEntre 50 et 79% = 2\n> 79% = 5","x":[["bt",50.0,79.0,2],["lt",50.0,0,0],["gt",79.0,0,5]],"e":"Numérateur : nombre d’agents de santé formés ou briefés sur la SIMR et les événements au cours des 12 derniers mois \nvérifier les rapports et liste de présence d’abord et si non disponible mettez 0 agent formé. Si disponible, décompter le nombre d’agents qualifiés sur les listes de présence des formation ou briefing organisés et vérifier les dates si elles sont dans la période concernée. Prendre en compte aussi la formation en épidémiologie de terrain  \nDénominateur : nombre total d’agents de santé devant être formé = utiliser le fichier du personnel de la zone y compris les hôpitaux. Décompter les agents qualifiés de la périphérie et des services de pédiatrie, médecine, urgences, gynécologie/maternité, laboratoire"},{"n":3,"t":"Proportion de formations sanitaires disposant des définitions de cas standards des MPE et/ou le guide technique SIMR","c":0.8,"p":3,"f":1,"r":"< 50% = 0\nEntre 50 et 79% = 1\n> 79% = 3","x":[["bt",50.0,79.0,1],["lt",50.0,0,0],["gt",79.0,0,3]],"e":"Numérateur: nombre de formations sanitaires ayant une définition de cas standard et/ou le guide technique SIMR = vérifier la disponibilité de la fiche technique de définition de cas dans 3 formations sanitaires situées dans un rayon de 10 km du BZ et dans les hôpitaux  \nDénominateur: nombre total de formations sanitaires= prendre le nombre de formations sanitaires visitées y compris les hôpitaux"},{"n":4,"t":"Proportion de RC disposant de définition de cas communautaires des MPE ou modules de formation avec les définitions de cas","c":0.8,"p":3,"f":1,"r":"< 50% = 0\nEntre 50 et 79% = 1\n> 79% = 3","x":[["bt",50.0,79.0,1],["lt",50.0,0,0],["gt",79.0,0,3]],"e":"Numérateur : nombre de RC disposant de définition de cas communautaires des MPE \nVérifier physiquement chez 10 RC dans les 3 formations sanitaires visitées\nDénominateur : nombre total de RC = nombre de RC visités\nNB : le jour de l’évaluation, inviter les relais situés dans un rayon de 5-10km à venir avec tous les documents de santé com sans préciser la définition de cas et vérifier la disponibilité chez les 10 relais. En cas de difficultés, joindre les relais au téléphone et demander de lire le titre des documents dont ils disposent. Après avoir ciblé le document en lien avec la définition de cas, demander de lire la définition de cas de deux maladies dans le document et préciser la page et apprécier. Les évaluateurs peuvent utiliser autre moyen pour vérifier la disponibilité réelle (soyez plus objectif)"},{"n":5,"t":"Proportion de Zones sanitaires ayant organisées au moins une recherche active (sites prioritaires) par semestre","c":0.8,"p":3,"f":1,"r":"< 50% = 0\nEntre 50 et 79% = 1\n> 79% = 3","x":[["bt",50.0,79.0,1],["lt",50.0,0,0],["gt",79.0,0,3]],"e":"Numérateur : Nombre de Zones sanitaires ayant organisées au moins une recherche active (sites prioritaires) par semestre = vérifier la disponibilité d'un rapport d'activité (recherche active)  ; décompter le nombre de ZS ayant organisée au moins une recherche active dans la période concernée pour PFA\nDénominateur : Nombre total de Zones Sanitaires"},{"n":6,"t":"Proportion de recherches actives (sites prioritaires) réalisées dans la Zone sanitaire","c":0.8,"p":5,"f":1,"r":"< 50% = 0\nEntre 50 et 79% = 2\n> 79% = 5","x":[["bt",50.0,79.0,2],["lt",50.0,0,0],["gt",79.0,0,5]],"e":"Numérateur: Nombre de recherches actives (sites prioritaires) réalisées dans la Zone Sanitaire avec ODK (Prendre les chiffres de la requête dans ODK)\nDénominateur: Nombre de recherches actives à réaliser selon les normes (Prendre les chiffres de la requête dans ODK)"},{"n":7,"t":"Proportion de Formations Sanitaires ayant notifié au moins 01 cas des maladies sous surveillance au cours des six (6) derniers mois","c":0.3,"p":3,"f":1,"r":"< 30% = 0\n> 29% = 3","x":[["lt",30.0,0,0],["gt",29.0,0,3]],"e":"Numérateur: nombre de Formations Sanitaires ayant notifié au moins 01 cas des maladies sous surveillance au cours des six (6) derniers mois= Demander au RCSE de faire la requête pour les maladies concernées, pour la période concernée (données= maladies ; Période= période concernée, unité d’organisation= formation sanitaire. décompter le nombre de FS ayant notifié au moins un cas dans la période concernée\nDénominateur: Nombre total de Formations Sanitaires de la zones \nPrendre en compte les formations sanitaires retenues dans le DHIS2 \nPrendre en compte les 17 maladies suivantes : Choléra, Méningite, Fièvre jaune, Tétanos néonatal, PFA, Rougeole, Shigellose, Rage, Charbon Bactéridien , Intoxication alimentaire, Fièvre Lassa, Fièvre Ebola, Dengue, Fièvre Marburg, Chikungunya, Zika, Mpox"},{"n":8,"t":"Proportion de cas de maladies ou autres événements sous surveillance, notifiés à l’aide des formulaires de notification des cas ou listes linéaires.","c":0.8,"p":3,"f":1,"r":"< 50% = 0\nEntre 50 et 79% = 1\n> 79% = 3","x":[["bt",50.0,79.0,1],["lt",50.0,0,0],["gt",79.0,0,3]],"e":"Numérateur : Nombre de cas de maladies ou autres événements sous surveillance, notifiés à l’aide des formulaires de notification des cas ou listes linéaires = décompter les fiches de notification et liste linéaire (en cas d’épidémie) de la période concernée. \nDénominateur : Nombre total de cas de maladies ou évènements notifiés \nUtiliser les rapports hebdomadaires du RCSE et compter le nombre total  de cas des 17 maladies suivante notifiées dans la période concernée : Choléra, Méningite, Fièvre jaune, Tétanos néonatal, PFA, Rougeole, Shigellose, Rage, Charbon Bactéridien , Intoxication alimentaire, Fièvre Lassa, Fièvre Ebola, Dengue, Fièvre Marburg, Chikungunya, Zika, Mpox"},{"n":9,"t":"Proportion de cas suspects des MPE dont les fiches de notification portent un numéro EPID","c":0.95,"p":3,"f":1,"r":"< 50% = 0\nEntre 50 et 94% = 1\n> 94% = 3","x":[["bt",50.0,94.0,1],["lt",50.0,0,0],["gt",94.0,0,3]],"e":"Numérateur : Nombre de cas suspects des MPE dont les fiches portent un numéro EPID \nDénominateur : Nombre total de cas suspects des MPE\nUtiliser les rapports hebdomadaires du RCSE et compter le nombre total  de cas des 17 maladies suivante notifiées dans la période concernée : Choléra, Méningite, Fièvre jaune, Tétanos néonatal, PFA, Rougeole, Shigellose, Rage, Charbon Bactéridien , Intoxication alimentaire, Fièvre Lassa, Fièvre Ebola, Dengue, Fièvre Marburg, Chikungunya, Zika, Mpox"}]},{"o":"Objectif 2: Accroitre la participation des acteurs des hôpitaux et des structures sanitaires privés dans la surveillance des maladies et évènements prioritaires y compris les décès","i":[{"n":10,"t":"Proportion des hôpitaux publics et privés dotés des supports clés de notification (les fiches de notification, les rapports hebdomadaire, fiche technique SIMR de définitions standards)","c":0.95,"p":3,"f":1,"r":"< 50% = 0\nEntre 50 et 94% = 1\n> 94% = 3","x":[["bt",50.0,94.0,1],["lt",50.0,0,0],["gt",94.0,0,3]],"e":"Numérateur : nombre d’hôpitaux publics et privés dotés de supports clés de notification (les fiches de notification, les rapports hebdomadaire, fiche technique SIMR de définition standards) = appliquer la loi de tout ou rien\nDénominateur : nombre total d'hôpitaux publics et privés\nNB: Pour les zones de 3A et ZOBOZA, voir dans les centres de santé de commune"},{"n":11,"t":"Proportion des structures privées exceptées les hôpitaux privés dotés de supports clés de notification (les fiches de notification, les rapports hebdomadaire, fiche technique SIMR de définitions standards)","c":0.95,"p":3,"f":1,"r":"< 50% = 0\nEntre 50 et 94% = 1\n> 94% = 3","x":[["bt",50.0,94.0,1],["lt",50.0,0,0],["gt",94.0,0,3]],"e":"Numérateur : nombre de structures privées exceptées les hôpitaux privés dotés de supports clés de notification (les fiches de notification, les rapports hebdomadaire, fiche technique SIMR de définitions standards) = Appeler 5 structures privées exceptées les hôpitaux privés pour vérifier (envoi des photos des supports dans les 5 mn suivant l’appel\nDénominateur : nombre de structures privées exceptées les hôpitaux privés appelées"},{"n":12,"t":"Proportion du personnel (point focaux surveillance, surveillants de pavillons, cliniciens de la médecine, pédiatrie, des urgences et gynécologie) des hôpitaux publics et privés formés sur la surveillance intégrée des maladies et riposte","c":0.5,"p":3,"f":1,"r":"< 25% = 0\nEntre 25 et 49% = 1\n> 49% = 3","x":[["bt",25.0,49.0,1],["lt",25.0,0,0],["gt",49.0,0,3]],"e":"Numérateur : nombre de personnel (point focaux surveillance, surveillants de pavillons, cliniciens de la médecine, pédiatrie, des urgences et gynécologie) des hôpitaux publics et privés formés sur la surveillance intégrée des maladies et riposte\nDénominateur : nombre total de personnel de santé des hôpitaux publics et privés (pédiatre, point focaux surveillance, surveillants de pavillons, cliniciens de la médecine des urgences et gynécologie)\nPrendre en compte seulement que la formation en FETP, epidémiologie de terrain et sur le guide SIMR  3ème édition réalisée par le niveau national et la DDS  (liste et rapport à fournir par le niveau national et la DDS)"},{"n":13,"t":"Proportion de Formations Sanitaires privées ayant notifié au moins 01 cas des maladies sous surveillance au cours des six (6) derniers mois","c":0.3,"p":3,"f":1,"r":"< 25% = 0\nEntre 25 et 29% = 1\n> 29% = 3","x":[["bt",25.0,29.0,1],["lt",25.0,0,0],["gt",29.0,0,3]],"e":"Numérateur: nombre de formations sanitaires privés ayant notifié au moins 01 cas des maladies sous surveillance au cours des six (6) derniers mois= Demander au RCSE de faire la requête pour les maladies concernées, pour la période concernée (données= maladies ; Période= période concernée, unité d’organisation= formation sanitaire. décompter le nombre de FS privées ayant notifié au moins un cas dans la période concernée\nDénominateur: Nombre total de Formations Sanitaires privées = compter les privés paramétrés dans le DHIS2 (enlever les privés qui  ne consultent pas et ne donnent pas de soins médicaux)\nPrendre en compte les 17 maladies suivantes : Choléra, Méningite, Fièvre jaune, Tétanos néonatal, PFA, Rougeole, Shigellose, Rage, Charbon Bactéridien , Intoxication alimentaire, Fièvre Lassa, Fièvre Ebola, Dengue, Fièvre Marburg, Chikungunya, Zika, Mpox"}]},{"o":"Objectif 3: Renforcer la gestion des données de surveillance à tous les niveaux du système de santé en utilisant les outils électroniques","i":[{"n":14,"t":"Proportion de maladies prioritaires confirmées pour lesquelles une carte de distribution existe","c":0.3,"p":3,"f":1,"r":"< 25% = 0\nEntre 25 et 29% = 1\n> 29% = 3","x":[["bt",25.0,29.0,1],["lt",25.0,0,0],["gt",29.0,0,3]],"e":"Numérateur: nombre de maladies prioritaires confirmées pour lesquelles une carte de distribution existe = voir la carte affichée montrant les cas confirmés\nDénominateur: nombre total de maladies sous surveillance épidémiologique  avec cas confirmées"},{"n":15,"t":"Proportion de semaines avec bulletins épidémiologiques hebdomadaires","c":0.8,"p":5,"f":1,"r":"< 50% = 0\nEntre 50 et 79% = 2\n> 79% = 5","x":[["bt",50.0,79.0,2],["lt",50.0,0,0],["gt",79.0,0,5]],"e":"Numérateur: Nombre de semaines avec bulletins épidémiologiques pour de la période\nDénominateur: Nombre total de semaines évaluées\nVoir physiquement les  bulletins épidémiologiques édité au cours de la période concernée (version papier ou électronique). Pour le niveau du département, ca fait le nombre de zone sanitaire ayant édité au moins un bulletin sur le nombre total de zone sanitaire."},{"n":16,"t":"Proportion de Zones sanitaires ayant calculé les taux d'attaque pendant les épidémies","c":0.7,"p":3,"f":1,"r":"< 50% = 0\nEntre 50 et 69% = 1\n> 69% = 3","x":[["bt",50.0,69.0,1],["lt",50.0,0,0],["gt",69.0,0,3]],"e":"Numérateur: nombre de Zones sanitaires ayant calculé les taux d'attaque pendant les épidémies \nDénominateur: nombre de zones sanitaires en épidémie\nVérifier si la zone a connu d'épidémie au cours de la période ( base des évènements, Rapports hebdomadaire partie nombre épidémie confirmé); \nsi pas épidémie, NA; \nsi épidémie, vérifier le calcul du taux d'attaque sur SitRep, rapport d'investigation, rapport de fin d'épidémie. Appliquer la loi de tout ou rien pour toutes les épidémies (si par exemple si 2 épidémies dans la période, le taux d'attaque doit être caculé pour les 2 épidémies)"},{"n":17,"t":"Complétude des rapports hebdomadaires des formations sanitaires de la zone ( copies physique des rapports)","c":0.8,"p":3,"f":1,"r":"< 50% = 0\nEntre 50 et 79% = 1\n> 79% = 3","x":[["bt",50.0,79.0,1],["lt",50.0,0,0],["gt",79.0,0,3]],"e":"Numérateur: nombre de rapports hebdomadaires des formations sanitaires disponibles pour toutes les semaines de la période évaluée (décompter tous rapports disponibles pour toutes les FS et pour toutes les sémaines évaluées)\nDénominateur: nombre total de formations sanitaires X nombre de semaines évaluées"},{"n":18,"t":"Promptitude dans la transmission des rapports hebdomadires des formations à la zone (avec tableau de promptitude)","c":0.8,"p":3,"f":1,"r":"< 50% = 0\nEntre 50 et 79% = 1\n> 79% = 3","x":[["bt",50.0,79.0,1],["lt",50.0,0,0],["gt",79.0,0,3]],"e":"Numérateur: nombre de rapports hebdomadaires des formations sanitaires disponibles pour toutes les semaines de la période évaluée (décompter tous rapports disponibles pour toutes les FS et pour toutes les sémaines évaluées)\nDénominateur: nombre total de formations sanitaires X nombre de semaines évaluées\nNB: Si tableau de prmptitude non disponible mettre Zéro au numérateur"},{"n":19,"t":"Complétude de la saisie des rapports hebdomadaire des formations sanitaires de la zone (dans le DHIS2)","c":0.8,"p":3,"f":1,"r":"< 50% = 0\nEntre 50 et 79% = 1\n> 79% = 3","x":[["bt",50.0,79.0,1],["lt",50.0,0,0],["gt",79.0,0,3]],"e":"Numérateur: nombre de formations sanitaires avec saisie des rapports hebdomadaires dans le DHIS2\nDénominateur: nombre total de formations sanitaires\nPrendre la requête DHIS2 du niveau national"},{"n":20,"t":"Promptitude de la saisie des rapports hebdomadaires des formations sanitaire de la zone (dans le DHIS2)","c":0.8,"p":3,"f":1,"r":"< 50% = 0\nEntre 50 et 79% = 1\n> 79% = 3","x":[["bt",50.0,79.0,1],["lt",50.0,0,0],["gt",79.0,0,3]],"e":"Numérateur: nombre de formations sanitaires avec saisie à temps des rapports hebdomadaires dans le DHIS2\nDénominateur: nombre total de formations sanitaires\nPrendre la requête DHIS2 du niveau national"},{"n":21,"t":"Proportion de Zones Sanitaires ayant calculé la létalité pendant les épidémies","c":0.7,"p":3,"f":1,"r":"< 50% = 0\nEntre 50 et 69% = 1\n> 69% = 3","x":[["bt",50.0,69.0,1],["lt",50.0,0,0],["gt",69.0,0,3]],"e":"Numérateur: nombre de Zones sanitaires ayant calculé la létalité pendant les épidémies \nDénominateur: nombre de zones sanitaires en épidémie\nVérifier si la zone a connu d'épidémie au cours de la période ( base des évènements, Rapports hebdomadaire partie nombre épidémie confirmé); \nsi pas épidémie, NA; \nsi épidémie, vérifier le calcul de la létalité sur les SitRep, rapports d'investigation, rapports de fin d'épidémie. Appliquer la loi de tout ou rien pour toutes les épidémies (si par exemple si 2 épidémies dans la période, la létalité doit être caculée pour les 2 épidémies)"},{"n":22,"t":"Proportion de fiches de notification complètements et correctement remplies","c":0.7,"p":3,"f":1,"r":"< 50% = 0\nEntre 50 et 69% = 1\n> 69% = 3","x":[["bt",50.0,69.0,1],["lt",50.0,0,0],["gt",69.0,0,3]],"e":"Numérateur: Nombre de fiches de notification complètement et correctement remplies ; \nDénominateur: Nombre total de fiches vérifiées\nNB : Echantionner 20 fiches par les maladies suivantes :  Méningite, Fièvre jaune,  PFA, Rougeole, Shigellose, Rage, Intoxication alimentaire, Fièvre Lassa,  Dengue, Mpox, Décès maternels et néonatals. \nVérifier le remplissage de toutes les variables y compris quartier/village de résidence, adresses et téléphone du patient ou du parent ou référant, date et heure de prélèvement, date d’envoi des échantillons, numéro EPID etc.  Appliquer la loi de « tout ou rien » selon les variables qui doivent être renseignées pour chaque maladie. Utiliser un bic rouge pour mentionner un point d’interrogation ( ?) sur devant les variables non renseignées et scanner ces fiches pour preuve et briefing du personnel en leur montrant les variables souvent non renseignées sur les fiches (soyez très rigoureux pour obtenir un changement pour les évaluations futures)"},{"n":23,"t":"Proportion de fiches de notification saisies sans erreurs","c":0.7,"p":3,"f":1,"r":"< 50% = 0\nEntre 50 et 69% = 1\n> 69% = 3","x":[["bt",50.0,69.0,1],["lt",50.0,0,0],["gt",69.0,0,3]],"e":"Numérateur: Nombre de fiches de notification saisies sans erreurs\nEchantionner 20 fiches de maladies différentes dont 5 pour décès (DM, DNN et autres décès) et vérifier la saisie dans la base SIMR et appliquer la loi de tout ou rien mais faire attention aux variables non applicable et non saisie. Prendre chaque fiche et demander au RCSE de rechercher l’enregistrement dans la base SIMR. Compter le nombre de fiches saisies sans erreur.\nDénominateur: Nombre de fiches vérifiées (20 fiches)"},{"n":24,"t":"Proportion de Zones Sanitaires ayant organisé une validation semestrielle des données avec toutes les formations sanitaires sur les données de surveillance épidémiologique","c":0.6,"p":5,"f":1,"r":"< 50% = 0\nEntre 50 et 59% = 2\n> 59% = 5","x":[["bt",50.0,59.0,2],["lt",50.0,0,0],["gt",59.0,0,5]],"e":"Numérateur: Nombre de Zones Sanitaires ayant organisées  une validation semestrielle des données avec toutes les formations sanitaires sur les données de surveillance épidémiologique\nDénominateur: Nombre de Zones Sanitaires\nVérifier la liste de  présence et  le rapport version papier signé de la séance de validation des données"}]},{"o":"Objectif 4: Renforcer la coordination de la SIMR à tous les niveaux avec l’approche « One Health »","i":[{"n":25,"t":"Proportion de réunions EIR élargie aux autres secteurs réalisées","c":0.6,"p":3,"f":1,"r":"< 50% = 0\nEntre 50 et 59% = 1\n> 59% = 3","x":[["bt",50.0,59.0,1],["lt",50.0,0,0],["gt",59.0,0,3]],"e":"Numérateur : Nombre de réunions EIR élargie aux autres secteurs réalisées\nDénominateur : Nombre de réunions EIR attendues (une réunion par trimestre)\nVérifier la présence de rapport version papier signée et la liste de présence des personnes ayant pris part à ces réunions. \nSi la liste de présence ne comporte pas les acteurs des autres secteurs, ne pas considérer cette réunion"},{"n":26,"t":"Proportion de zone disposant d'un comité de gestion des épidémies One Health fonctionnel (l'acte officiel de désignation, rapport et liste de présence des réunions)","c":0.5,"p":3,"f":1,"r":"< 25% = 0\nEntre 25 et 49% = 1\n> 49% = 3","x":[["bt",25.0,49.0,1],["lt",25.0,0,0],["gt",49.0,0,3]],"e":"Numérateur : Nombre de zones disposant d'un comité de gestion des épidémies One Health fonctionnel (l'acte officiel de désignation, rapport et liste de présence des réunions)\nDénominateur : Nombre de zones\nVérifier la présence de l'acte de désignation des membres comité One Health, la liste de présence et rapport papier signé d'au moins une réunion au cours de la période pour apprécier le fonctionalité."},{"n":27,"t":"Proportion de réunions ordinaires trimestrielles du comité de gestion des épidémies réalisées","c":0.5,"p":3,"f":1,"r":"< 25% = 0\nEntre 25 et 49% = 1\n> 49% = 3","x":[["bt",25.0,49.0,1],["lt",25.0,0,0],["gt",49.0,0,3]],"e":"Numérateur : Nombre de réunions du comité de gestion des épidémies réalisées\nDénominateur : Nombre de réunions attendues (une réunion par trimestre)\nVérifier la présence de rapport version papier signé de réunions du comité de gestion des épidémie et la liste de présence des personnes ayant pris part à ces réunions."},{"n":28,"t":"Proportion de Zone Sanitaire disposant d'un acte officiel de désignation actualisé des membres EIR dans une approche « One health »","c":0.7,"p":3,"f":1,"r":"< 50% = 0\nEntre 50 et 69% = 1\n> 69% = 3","x":[["bt",50.0,69.0,1],["lt",50.0,0,0],["gt",69.0,0,3]],"e":"Numérateur : nombre de Zone Sanitaire disposant d'un acte officiel de désignation actualisé des membres EIR dans une approche « One health »\nDénominateur : Nombre de Zone Sanitaire\nVérifier acte officiel signé de désignation"}]},{"o":"Objectif 5: Renforcer le dispositif de préparation et de riposte du système de santé à tous les niveaux","i":[{"n":29,"t":"Disponibilité des intrants nécessaires pour la riposte en situation d’urgence (voir la liste des intrants traceurs)","c":0.7,"p":10,"f":1,"r":"< 50% = 0\nEntre 50 et 69% = 5\n> 69% = 10","x":[["bt",50.0,69.0,5],["lt",50.0,0,0],["gt",69.0,0,10]],"e":"Numérateur : Nombre d'intrants disponibles en quantité\nVérifier la disponibilité pour les intrants de Rougeole, choléra, méningite, Lassa, Mpox et les catastrophes. Vérifier la disponibilité sur les fiches de stock de chaque intrant ou  dans la base de gestion des intrants. Pour chaque intrant, vérifier s’il est disponible actuellement au passage de l'équipe d'évaluation\nDénominateur : Nombre total d'intrants (Nombre total d’intrants retenus sur la liste des intrants de Rougeole, choléra, méningite, Lassa, Mpox et les catastrophes. La liste sera fournie par le niveau national)"},{"n":30,"t":"Proportion de Zone Sanitaire disposant d’un plan de préparation et de riposte aux épidémies ou autres urgences","c":0.7,"p":5,"f":1,"r":"< 50% = 0\nEntre 50 et 69% = 2\n> 69% = 5","x":[["bt",50.0,69.0,2],["lt",50.0,0,0],["gt",69.0,0,5]],"e":"Numérateur : Nombre de Zone Sanitaire disposant d’un plan de préparation et de riposte aux épidémies ou autres urgences \nDénominateur : Nombre de Zone Sanitaire\nConsidérer les plans élaborés avec l’appui de l’ANSSP et voir un exemplaire en PDF ou version reprographiée"},{"n":31,"t":"Proportion d'Equipe d'Intervention Rapide (EIR) formées les trois dernières années (proportion de membres EIR formé au niveau de la zone)","c":0.5,"p":10,"f":1,"r":"< 25% = 0\nEntre 25 et 49% = 5\n> 49% = 10","x":[["bt",25.0,49.0,5],["lt",25.0,0,0],["gt",49.0,0,10]],"e":"Numérateur : nombre d'Equipe d'Intervention Rapide (EIR) formées dans le pays les trois dernières années\nDénominateur : Nombre total d'EIR\nToutes les EIR formées avec les rapports et listes de présence disponibles  à l'ANSSP (Liste des membres formés à fournir par le COUSP)"},{"n":32,"t":"Proportion de Zone Sanitaire disposant de fonds pour la riposte aux situations d’urgence (ou d’une ligne budgétaire pour des fonds consacrés aux situations d’urgence supérieur ou égale à 3 000 000 FCFA)","c":0.7,"p":3,"f":1,"r":"< 50% = 0\nEntre 50 et 69% = 1\n> 69% = 3","x":[["bt",50.0,69.0,1],["lt",50.0,0,0],["gt",69.0,0,3]],"e":"Numérateur : Nombre de Zone Sanitaire disposant de fond pour la riposte aux situations d’urgence (ou d’une ligne budgétaire pour des fonds consacrés aux situations d’urgence supérieur ou égale à 3 000 000 FCFA)\nDénominateur : Nombre de Zone Sanitaire\nDemander la bonne version du PTA de l’année et voir le montant prévu pour la gestion des situations d’urgence ( faire la sommes des montants alloués au ripostes, recherche active, investigation, validation des données de surveillance, formation du personnel en surveillance, etc)"},{"n":33,"t":"Proportion d'hôpitaux disposant de réactifs pour les diagnostics de laboratoire pour la confirmation des MPE (méningite, cholera)","c":0.7,"p":5,"f":1,"r":"< 50% = 0\nEntre 50 et 69% = 2\n> 69% = 5","x":[["bt",50.0,69.0,2],["lt",50.0,0,0],["gt",69.0,0,5]],"e":"Numérateur : nombre d'hôpitaux disposant de réactifs pour les diagnostics de laboratoire pour la confirmation des MPE (méningite, choléra) ; utiliser les fiches de stock ou base de gestion pour vérifier les intrants disponibles ou autres documents pouvant attester de la disponibilité des réactifs\n\nDénominateur : Nombre total d'hôpitaux"},{"n":34,"t":"Proportion de formations sanitaires disposant de matériel de prélèvement et le transport des échantillons","c":0.7,"p":3,"f":1,"r":"< 50% = 0\nEntre 50 et 69% = 1\n> 69% = 3","x":[["bt",50.0,69.0,1],["lt",50.0,0,0],["gt",69.0,0,3]],"e":"Numérateur : nombre de formations sanitaires disposant de matériel de prélèvement et le transport des échantillons= Vérifier les 3 formations sanitaires située dans un rayon de 10 km du BZ . Utiliser la liste du matériel de prélèvement (Tubes , aiguille de ponction, pot de PFA, glacière dédié au transport des échantillons, etc)\n\nDénominateur: Nombre total de formations sanitaires visitées\nPrendre en compte le matériel de prélèvement pour Méningite, Fièvre jaune, PFA (voir au niveau de la commune), Rougeole, Shigellose, Mpox"},{"n":35,"t":"Proportion de cas suspects de maladies sous surveillance avec prélèvement réalisé pour confirmation","c":0.7,"p":3,"f":1,"r":"< 50% = 0\nEntre 50 et 69% = 1\n> 69% = 3","x":[["bt",50.0,69.0,1],["lt",50.0,0,0],["gt",69.0,0,3]],"e":"Numérateur : nombre de cas suspects de maladies sous surveillance avec prélèvement réalisé pour confirmation= Utiliser les fiches de notification et compter le nombre de cas prélevés pour ces maladies : Choléra, Méningite, Fièvre jaune, PFA, Rougeole, Shigellose, Fièvre Lassa, Fièvre Ebola, Dengue, Fièvre Marburg, Chikungunya, Mpox\n\nDénominateur : Nombre de cas nécessitant de prélèvement (soustraire les cas confirmés par lien épidémiologique) = Décompter sur les rapports hebdomadaires de la période, le nombre de cas notifiés pour les maladies : Choléra, Méningite, Fièvre jaune, PFA, Rougeole, Shigellose, Fièvre Lassa, Fièvre Ebola, Dengue, Fièvre Marburg, Chikungunya , Mpox"},{"n":36,"t":"Proportion d’échantillons de cas suspects convoyés au laboratoire local dans les 24 heures suivant le prélèvement (pour méningite)","c":0.5,"p":3,"f":1,"r":"< 25% = 0\nEntre 25 et 49% = 1\n> 49% = 3","x":[["bt",25.0,49.0,1],["lt",25.0,0,0],["gt",49.0,0,3]],"e":"Calculer pour méningite\nNumérateur : Le nombre de cas suspects pour lesquels des échantillons ont été envoyés dans un délai de 24 heures = Sélectionner toutes les fiches de la méningite de la période et trier celles dont le délai entre la date de prélèvement et d’envoi au laboratoire de l'hôpital  est inférieur ou égal à 24h\nDénominateur : Le nombre total de cas suspects prélevés = nombre total de cas de méningite enregistrés dans les rapports hebdomadaires du RCSE dans la période"},{"n":37,"t":"Proportion de maladies sous surveillance prélevées et saisies dans DHIS2 avec résultats de laboratoire","c":0.7,"p":3,"f":1,"r":"< 50% = 0\nEntre 50 et 69% = 1\n> 69% = 3","x":[["bt",50.0,69.0,1],["lt",50.0,0,0],["gt",69.0,0,3]],"e":"Numérateur : le nombre de maladies sous surveillance prélevées et saisies dans DHIS2 avec résultats de laboratoire= utiliser l’export en Excel de la base SIMR de la période concernée et décompter les cas pour lesquels le résultat de laboratoire est renseigné\n\nDénominateur : Nombre total de cas prélevés= pour Choléra, Méningite, Fièvre jaune, PFA, Rougeole, Shigellose, Fièvre Lassa, Fièvre Ebola, Dengue, Fièvre Marburg, Chikungunya , Mpox"},{"n":38,"t":"Proportion d’épidémies confirmées pour lesquelles une riposte a été organisée","c":0.8,"p":5,"f":1,"r":"< 50% = 0\nEntre 50 et 79% = 2\n> 79% = 5","x":[["bt",50.0,79.0,2],["lt",50.0,0,0],["gt",79.0,0,5]],"e":"Numérateur : Le nombre d’épidémies confirmées pour lesquelles une riposte a été organisée= décompter dans la base des événements les épidémies et vérifier celles pour lesquelles une riposte est organisée. Vérifier l’effectivité de la riposte dans les rapports de riposte, ou rapports de gestion de l’épidémie, rapport d’investigation, SitRep \nDénominateur : Le nombre d’épidémies confirmées dans la zone sanitaire= décompter dans la base des événements les épidémies confirmées"},{"n":39,"t":"Proportion de suspicions de flambée de maladie à potentiel épidémique et d’autres événements de santé publique déclarés au niveau de la zone sanitaire dans les 24 heures suivant le franchissement du seuil épidémique","c":0.7,"p":3,"f":1,"r":"< 50% = 0\nEntre 50 et 69% = 1\n> 69% = 3","x":[["bt",50.0,69.0,1],["lt",50.0,0,0],["gt",69.0,0,3]],"e":"Numérateur : Le nombre de suspicions de flambée de maladies à potentiel épidémique déclarées au niveau de la zone sanitaire dans les 24 heures suivant le franchissement du seuil épidémique= Décompter les suspicions d’épidémie dans la base des événements et ajouter les FHV et Mpox non enregistrés et vérifier leur notification à la DDS dans les 24h avec la Fiche de notification des flambées et autres documents ou SpotRep. Utiliser le fichier de dépouillement d’envoi de mail, la base des évanements\nDénominateur : Le nombre total de suspicions de flambée de maladies à potentiel épidémique (voir dans la base des événements)"}]},{"o":"Objectif 6: Mettre en place un mécanisme de suivi et évaluation de la performance de la surveillance épidémiologique à tous les niveaux","i":[{"n":40,"t":"Proportion de maladies prioritaires pour lesquelles un graphique linéaire existe.","c":0.8,"p":3,"f":1,"r":"< 50% = 0\nEntre 50 et 79% = 1\n> 79% = 3","x":[["bt",50.0,79.0,1],["lt",50.0,0,0],["gt",79.0,0,3]],"e":"Numérateur : Le nombre de maladies prioritaires pour lesquelles un graphique linéaire existe= vérifier les courbes épidémiques tracées et affichées pour les maladies suivantes : Choléra, Méningite, Fièvre jaune, Tétanos néonatal, PFA, Rougeole, Shigellose, Rage, Fièvre Lassa, Dengue, Mpox\nDénominateur : Le nombre total de maladies considérées \nmaladies prioritaires = 11 maladies"},{"n":41,"t":"Proportion de supervisions trimestrielles réalisées sur la surveillance des maladies et évènements","c":0.7,"p":5,"f":1,"r":"< 50% = 0\nEntre 50 et 69% = 2\n> 69% = 5","x":[["bt",50.0,69.0,2],["lt",50.0,0,0],["gt",69.0,0,5]],"e":"Numérateur=  Nombre de supervisions réalisées; Vérifier les rapports de supervisions sur la surveillance. vérifier que les constats et les recommandations sur la surveillance sont mentionnés ; Si constats non détaillés par structure et vous avez les preuves dans la supervsion, prendre en compet mais expliquer que les constats doivent être détaillés par structure supervisée (pour la prochaine évaluation)\nDénominateur = Nombre de supervisions attendues dans la période évaluée ( trimestrielle)"},{"n":42,"t":"Proportion de formations sanitaires évaluées avec les indicateurs du cadre de performance","c":0.5,"p":10,"f":1,"r":"< 25% = 0\nEntre 25 et 49% = 5\n> 49% = 10","x":[["bt",25.0,49.0,5],["lt",25.0,0,0],["gt",49.0,0,10]],"e":"Numérateur = le nombre de FS évaluées avec les indicateurs du cadre de performance\nVérifier dans les fiches de collecte renseignées, rapport général de l'évaluation\nDénominateur = Nombre total de FS"},{"n":43,"t":"Proportion d'évaluation avec restitution et d'élaboration du Plan de Résolution des Problèmes","c":0.5,"p":5,"f":1,"r":"< 25% = 0\nEntre 25 et 49% = 2\n> 49% = 5","x":[["bt",25.0,49.0,2],["lt",25.0,0,0],["gt",49.0,0,5]],"e":"Numérateur= Nombre de séance de restitution. Vérifier les rapports de restitution avec liste de présence\nDénominateur: Nombre d'évaluation organisé"},{"n":44,"t":"Proportion de chargé de surveillance et de points focaux de surveillance des hôpitaux disposant d'outils informatique et de connexion pour la saisie des données dans le DHIS2","c":0.75,"p":5,"f":1,"r":"< 25% = 0\nEntre 25 et 74% =2\n> 74% = 5","x":[["bt",25.0,74.0,2],["lt",25.0,0,0],["gt",74.0,0,5]],"e":"Numérateur= Vérifier le nombre de chargé de surveillance et de points focaux de surveillance des hôpitaux disposant d'outils informatique et de connexion pour la saisie des données dans le DHIS2\nDénominateur= Nombre total de chargés de surveillance et de points focaux de surveillance des hôpitaux"},{"n":45,"t":"Proportion de formations sanitaires publiques disposant de tablette ou smartphone et de connexion pour la saisie des données dans le DHIS2","c":0.85,"p":5,"f":1,"r":"< 50% = 0\nEntre 50 et 84% = 2\n> 84% = 5","x":[["bt",50.0,84.0,2],["lt",50.0,0,0],["gt",84.0,0,5]],"e":"Numérateur : Nombre de formations sanitaires publiques disposant de tablette ou smartphone et de kit de connexion pour la saisie des données dans le DHIS2 = demander l’information au RCSE et MCZS et vérifier dans les formations sanitaires visitées\nDénominateur : Nombre total de formations publiques sanitaires"},{"n":46,"t":"Proportion de formations sanitaires privées disposant de tablette ou smartphone et de connexion pour la saisie des données dans le DHIS2","c":0.5,"p":3,"f":1,"r":"< 25% = 0\nEntre 25 et 49% = 1\n> 49% = 3","x":[["bt",25.0,49.0,1],["lt",25.0,0,0],["gt",49.0,0,3]],"e":"Numérateur : e PFA notifiés chez les enfants de moins de 15 ans de la 1ère à la 43ème semaine épidémiologique – nombre total de cas confirmé (PVS, VPDVc, Compatible) au cours de la même période) x 52 SE/43 SE) \nDénominateur : Nombre de cas de PFA attendus au cours l’année chez les enfants de moins de 15 ans (Population enfants moins de 15 ans / 100.000)"},{"n":68,"t":"Taux d’adéquation des selles des cas de PFA","c":0.9,"p":3,"f":1,"r":"< 75% = 0\nEntre 75 et 89% = 1\n> 89% = 3","x":[["bt",75.0,89.0,1],["lt",75.0,0,0],["gt",89.0,0,3]],"e":"Numérateur : Nombre de cas de PFA notifiés et respectant à la fois les 3 critères d’adéquation (2 échantillons de selles prélevés dans les 14 jours à compter de la date de début de la paralysie, intervalle entre 2 échantillons de selles = 24h - 48h, selles adéquates à l’arrivée au laboratoire) de la 1ère à la 43ème semaine épidémiologique\nDénominateur : Nombre de cas de PFA notifiés de la 1ère à la 44ème semaine épidémiologique"},{"n":69,"t":"Proportion d’entérovirus isolé dans les échantillons analysés de la surveillance des PFA","c":0.1,"p":3,"f":1,"r":"< 10% = 0\n>= 10% = 3","x":[["lt",10.0,0,0],["ge",10.0,0,3]],"e":"Numérateur : Nombre d’échantillons de PFA avec un résultat NPENT de la 1ère à la 43ème semaine épidémiologique\nDénominateur : Nombre d’échantillons de PFA avec un résultat de laboratoire de la 1ère à la 43ème semaine épidémiologique"},{"n":70,"t":"Proportion de communes ayant notifié et prélevé par an, au moins 1 cas suspect de rougeole","c":0.8,"p":3,"f":1,"r":"< 50% = 0\nEntre 50 et 79% = 1\n> 79% = 3","x":[["bt",50.0,79.0,1],["lt",50.0,0,0],["gt",79.0,0,3]],"e":"Numérateur : Nombre de communes ayant notifié et prélevé par an, au moins 1 cas suspect de rougeole\nDénominateur : Nombre de communes que compte la zone sanitaire/département/pays"},{"n":71,"t":"Proportion de commune ayant notifié et prélevé par an, au moins 1 cas suspect de fièvre jaune","c":0.8,"p":3,"f":1,"r":"< 50% = 0\nEntre 50 et 79% = 1\n> 79% = 3","x":[["bt",50.0,79.0,1],["lt",50.0,0,0],["gt",79.0,0,3]],"e":"Numérateur : Nombre de communes ayant notifié et prélevé par an, au moins 1 cas suspect de fièvre jaune\nDénominateur : Nombre de communes que compte la zone sanitaire/département/pays"},{"n":72,"t":"Proportion d’entérovirus isolé dans les échantillons analysés de la surveillance environnementale","c":0.5,"p":3,"f":1,"r":"< 50% = 0\n>= 50% = 3","x":[["lt",50.0,0,0],["ge",50.0,0,3]],"e":""}]}]},"DDS":{"obj":[{"o":"Objectif 1: Renforcer la capacité de détection précoce et de notification des maladies et évènements prioritaires y compris les décès à tous les niveaux y compris le niveau communautaire","i":[{"n":1,"t":"Proportion de Zones sanitaires ayant organisées au moins une recherche active (sites prioritaires) par semestre","c":0.8,"p":3,"f":1,"r":"< 50% = 0\nEntre 50 et 79% = 1\n> 79% = 3","x":[["bt",50.0,79.0,1],["lt",50.0,0,0],["gt",79.0,0,3]],"e":"Numérateur : Nombre de Zones sanitaires ayant organisées au moins une recherche active (sites prioritaires) par semestre = vérifier la disponibilité d'un rapport d'activité (recherche active)  ; décompter le nombre de ZS ayant organisée au moins une recherche active dans la période concernée pour PFA\nDénominateur : Nombre total de Zones Sanitaires"},{"n":2,"t":"Proportion de recherches actives (sites prioritaires) réalisées dans les Zones sanitaires","c":0.8,"p":5,"f":1,"r":"< 50% = 0\nEntre 50 et 79% = 2\n> 79% = 5","x":[["bt",50.0,79.0,2],["lt",50.0,0,0],["gt",79.0,0,5]],"e":"Numérateur: Nombre de recherches actives (sites prioritaires) réalisées dans les Zones Sanitaires avec ODK (Prendre les chiffres de la requête dans ODK)\nDénominateur: Nombre de recherches actives à réaliser selon les normes (Prendre les chiffres de la requête dans ODK)"}]},{"o":"Objectif 2: Accroitre la participation des acteurs des hôpitaux et des structures sanitaires privés dans la surveillance des maladies et évènements prioritaires y compris les décès","i":[{"n":3,"t":"Proportion des hôpitaux publics et privés dotés des supports clés de notification (les fiches de notification, les rapports hebdomadaire, fiche technique SIMR de définitions standards)","c":0.95,"p":3,"f":1,"r":"< 50% = 0\nEntre 50 et 94% = 1\n> 94% = 3","x":[["bt",50.0,94.0,1],["lt",50.0,0,0],["gt",94.0,0,3]],"e":"Numérateur : nombre d’hôpitaux publics et privés dotés de supports clés de notification (les fiches de notification, les rapports hebdomadaire, fiche technique SIMR de définition standards) = appliquer la loi de tout ou rien\nDénominateur : nombre total d'hôpitaux publics et privés"},{"n":4,"t":"Proportion de Formations Sanitaires privées ayant notifié au moins 01 cas des maladies sous surveillance au cours des six (6) derniers mois","c":0.3,"p":3,"f":1,"r":"< 25% = 0\nEntre 25 et 29% = 1\n> 29% = 3","x":[["bt",25.0,29.0,1],["lt",25.0,0,0],["gt",29.0,0,3]],"e":"Numérateur: nombre de formations sanitaires privés ayant notifié au moins 01 cas des maladies sous surveillance au cours des six (6) derniers mois= Demander au RCSE de faire la requête pour les maladies concernées, pour la période concernée (données= maladies ; Période= période concernée, unité d’organisation= formation sanitaire. décompter le nombre de FS privées ayant notifié au moins un cas dans la période concernée\nDénominateur: Nombre total de Formations Sanitaires privées = compter les privés paramétrés dans le DHIS2 (enlever les privés qui  ne consultent pas et ne donnent pas de soins médicaux)\nPrendre en compte les 17 maladies suivantes : Choléra, Méningite, Fièvre jaune, Tétanos néonatal, PFA, Rougeole, Shigellose, Rage, Charbon Bactéridien , Intoxication alimentaire, Fièvre Lassa, Fièvre Ebola, Dengue, Fièvre Marburg, Chikungunya, Zika, Mpox"}]},{"o":"Objectif 3: Renforcer la gestion des données de surveillance à tous les niveaux du système de santé en utilisant les outils électroniques","i":[{"n":5,"t":"Proportion de maladies prioritaires confirmées pour lesquelles une carte de distribution existe","c":0.3,"p":3,"f":1,"r":"< 25% = 0\nEntre 25 et 29% = 1\n> 29% = 3","x":[["bt",25.0,29.0,1],["lt",25.0,0,0],["gt",29.0,0,3]],"e":"Numérateur: nombre de maladies prioritaires confirmées pour lesquelles une carte de distribution existe = voir la carte affichée montrant les cas confirmés\nDénominateur: nombre total de maladies sous surveillance épidémiologique  avec cas confirmées"},{"n":6,"t":"Proportion de zones sanitaires ayant édité des bulletins épidémiologiques hebdomadires","c":0.3,"p":5,"f":1,"r":"< 25% = 0\nEntre 25 et 29% = 2\n> 29% = 5","x":[["bt",25.0,29.0,2],["lt",25.0,0,0],["gt",29.0,0,5]],"e":"Numérateur: Nombre de zones sanitaires ayant édité au moins un bulletin épidémiologique hebdomadaire de la période\nDénominateur: Nombre total de zones sanitaires\nVoir physiquement au moins un bulletin épidémiologique édité au cours de la période concernée (version papier ou électronique). Pour le niveau du département, ca fait le nombre de zone sanitaire ayant édité au moins un bulletin sur le nombre total de zone sanitaire."},{"n":7,"t":"Proportion de Zones sanitaires ayant calculé les taux d'attaque pendant les épidémies","c":0.7,"p":3,"f":1,"r":"< 50% = 0\nEntre 50 et 69% = 1\n> 69% = 3","x":[["bt",50.0,69.0,1],["lt",50.0,0,0],["gt",69.0,0,3]],"e":"Numérateur: nombre de Zones sanitaires ayant calculé les taux d'attaque pendant les épidémies \nDénominateur: nombre de zones sanitaires en épidémie\nVérifier si la zone a connu d'épidémie au cours de la période ( base des évènements, Rapports hebdomadaire partie nombre épidémie confirmé); \nsi pas épidémie, NA; \nsi épidémie, vérifier le calcul du taux d'attaque sur SitRep, rapport d'investigation, rapport de fin d'épidémie. Appliquer la loi de tout ou rien pour toutes les épidémies (si par exemple si 2 épidémies dans la période, le taux d'attaque doit être caculé pour les 2 épidémies)"},{"n":8,"t":"Complétude des rapports hebdomadaire des formations sanitaires saisis dans le DHIS2","c":0.8,"p":3,"f":1,"r":"< 50% = 0\nEntre 50 et 79% = 1\n> 79% = 3","x":[["bt",50.0,79.0,1],["lt",50.0,0,0],["gt",79.0,0,3]],"e":"Numérateur: nombre de formations sanitaires ayant transmis leurs rapports hebdomadaires\nDénominateur: nombre total de formations sanitaires\nPrendre la requête DHIS2 du niveau national"},{"n":9,"t":"Promptitude de la saisie des rapports hebdomadaires des formations sanitaire dans le DHIS2","c":0.8,"p":3,"f":1,"r":"< 50% = 0\nEntre 50 et 79% = 1\n> 79% = 3","x":[["bt",50.0,79.0,1],["lt",50.0,0,0],["gt",79.0,0,3]],"e":"Numérateur: nombre de formations sanitaires ayant transmis à temps leurs rapports hebdomadaires\nDénominateur: nombre total de formations sanitaires\nPrendre la requête DHIS2 du niveau national"},{"n":10,"t":"Proportion de Zones Sanitaires ayant calculé la létalité pendant les épidémies","c":0.7,"p":3,"f":1,"r":"< 50% = 0\nEntre 50 et 69% = 1\n> 69% = 3","x":[["bt",50.0,69.0,1],["lt",50.0,0,0],["gt",69.0,0,3]],"e":"Numérateur: nombre de Zones sanitaires ayant calculé la létalité pendant les épidémies \nDénominateur: nombre de zones sanitaires en épidémie\nVérifier si la zone a connu d'épidémie au cours de la période ( base des évènements, Rapports hebdomadaire partie nombre épidémie confirmé); \nsi pas épidémie, NA; \nsi épidémie, vérifier le calcul de la létalité sur les SitRep, rapports d'investigation, rapports de fin d'épidémie. Appliquer la loi de tout ou rien pour toutes les épidémies (si par exemple si 2 épidémies dans la période, la létalité doit être caculée pour les 2 épidémies)"},{"n":11,"t":"Proportion de Zones Sanitaires ayant organiser une validation semestrielle des données avec toutes les formations sanitaires sur les données de surveillance épidémiologique","c":0.6,"p":5,"f":1,"r":"< 50% = 0\nEntre 50 et 59% = 2\n> 59% = 5","x":[["bt",50.0,59.0,2],["lt",50.0,0,0],["gt",59.0,0,5]],"e":"Numérateur: Nombre de Zones Sanitaires ayant organisées  une validation semestrielle des données avec toutes les formations sanitaires sur les données de surveillance épidémiologique\nDénominateur: Nombre de Zones Sanitaires\nVérifier la liste de  présence et  le rapport version papier signé de la séance de validation des données"}]},{"o":"Objectif 4: Renforcer la coordination de la SIMR à tous les niveaux avec l’approche « One Health »","i":[{"n":12,"t":"Proportion de réunions EIR élargie aux autres secteurs réalisées","c":0.6,"p":3,"f":1,"r":"< 50% = 0\nEntre 50 et 59% = 1\n> 59% = 3","x":[["bt",50.0,59.0,1],["lt",50.0,0,0],["gt",59.0,0,3]],"e":"Numérateur : Nombre de réunions EIR élargie aux autres secteurs réalisées\nDénominateur : Nombre de réunions EIR attendues\nAttendu: une réunion par trimestre; Vérifier la présence de rapport version papier signé de réunions EIR élargies aux autres secteurs et la liste de présence des personnes ayant pris part à ces réunions. Si une zone a organisé une sur quatre, ca fait 1/4*100= 25%. \nFaire de meme  pour le département. Si la liste de présence ne comporte pas les acteurs des autres secteurs, ne pas considérer cette réunion"},{"n":13,"t":"Proportion de zones sanitaires disposant d'un comité de gestion des épidémies One Health fonctionnel (l'acte officiel de désignation, rapport et liste de présence des réunions)","c":0.5,"p":3,"f":1,"r":"< 25% = 0\nEntre 25 et 49% = 1\n> 49% = 3","x":[["bt",25.0,49.0,1],["lt",25.0,0,0],["gt",49.0,0,3]],"e":"Numérateur : Nombre de zones sanitaires disposant d'un comité de gestion des épidémies One Health fonctionnel (l'acte officiel de désignation, rapport et liste de présence des réunions)\nDénominateur : Nombre de zones\nVérifier la présence de l'acte de désignation des membres comité One Health et la liste de présence et rapport papier signé d'au moins une réunion au cours de la période pour apprécier le fonctionalité."},{"n":14,"t":"Proportion de réunions ordinaires trimestrielles du comité de gestion des épidémies réalisées","c":0.5,"p":3,"f":1,"r":"< 25% = 0\nEntre 25 et 49% = 1\n> 49% = 3","x":[["bt",25.0,49.0,1],["lt",25.0,0,0],["gt",49.0,0,3]],"e":"Numérateur : Nombre de réunions du comité de gestion des épidémies réalisées\nDénominateur : Nombre de réunions attendues\nAttendu: une réunion par trimestre\nVérifier la présence de rapport version papier signé de réunions du comité de gestion des épidémie et la liste de présence des personnes ayant pris part à ces réunions. Si une zone a organisé une sur quatre, ca fait 1/4*100= 25%."},{"n":15,"t":"Proportion de Zone Sanitaire disposant d'un acte officiel de désignation actualisé des membres EIR dans une approche « One health »","c":0.7,"p":3,"f":1,"r":"< 50% = 0\nEntre 50 et 69% = 1\n> 69% = 3","x":[["bt",50.0,69.0,1],["lt",50.0,0,0],["gt",69.0,0,3]],"e":"Numérateur : nombre de Zone Sanitaire disposant d'un acte officiel de désignation actualisé des membres EIR dans une approche « One health »\nDénominateur : Nombre de Zone Sanitaire\nVérifier acte officiel de désignation dans chaque Zone"},{"n":16,"t":"Proportion de département disposant d'un acte officiel de désignation actualisé des membres EIR dans une approche « One health »","c":0.7,"p":3,"f":1,"r":"< 50% = 0\nEntre 50 et 69% = 1\n> 69% = 3","x":[["bt",50.0,69.0,1],["lt",50.0,0,0],["gt",69.0,0,3]],"e":"Numérateur : nombre de départements disposant d'un acte officiel de désignation actualisé des membres EIR dans une approche « One health »\nDénominateur: Nombre de départements\nVérifier acte officiel de désignation dans chaque DDS"}]},{"o":"Objectif 5: Renforcer le dispositif de préparation et de riposte du système de santé à tous les niveaux","i":[{"n":17,"t":"Disponibilité des intrants nécessaires pour la riposte en situation d’urgence (voir la liste des intrants traceurs)","c":0.7,"p":10,"f":1,"r":"< 50% = 0\nEntre 50 et 69% = 5\n> 69% = 10","x":[["bt",50.0,69.0,5],["lt",50.0,0,0],["gt",69.0,0,10]],"e":"Numérateur : Nombre d'intrants disponibles en quantité\nVérifier la disponibilité pour les intrants de Rougeole, choléra, méningite, Lassa, Mpox et les catastrophes. Vérifier la disponibilité sur les fiches de stock de chaque intrant ou  dans la base de gestion des intrants. Pour chaque intrant, vérifier s’il est disponible actuellement au passage de l'équipe d'évaluation\nDénominateur : Nombre total d'intrants (Nombre total d’intrants retenus sur la liste des intrants de Rougeole, choléra, méningite, Lassa, Mpox et les catastrophes. La liste sera fournie par le niveau national)"},{"n":18,"t":"Proportion de Zone Sanitaire disposant d’un plan de préparation et de riposte aux épidémies ou autres urgences","c":0.7,"p":5,"f":1,"r":"< 50% = 0\nEntre 50 et 69% = 2\n> 69% = 5","x":[["bt",50.0,69.0,2],["lt",50.0,0,0],["gt",69.0,0,5]],"e":"Numérateur : Nombre de Zone Sanitaire disposant d’un plan de préparation et de riposte aux épidémies ou autres urgences \nDénominateur : Nombre de Zone Sanitaire\nConsidérer les plans élaborés avec l’appui de l’ANSSP et voir un exemplaire en PDF ou version reprographiée"},{"n":19,"t":"Proportion d'Equipe d'Intervention Rapide (EIR) formées les trois dernières années","c":0.5,"p":10,"f":1,"r":"< 25% = 0\nEntre 25 et 49% = 5\n> 49% = 10","x":[["bt",25.0,49.0,5],["lt",25.0,0,0],["gt",49.0,0,10]],"e":"Numérateur : nombre d'Equipe d'Intervention Rapide (EIR) formées  les trois dernières années\nDénominateur : Nombre total d'EIR\nToutes les EIR formées avec les rapports et listes de présence disponibles  à l'ANSSP"},{"n":20,"t":"Proportion de Zone Sanitaire disposant de fonds pour la riposte aux situations d’urgence (ou d’une ligne budgétaire pour des fonds consacrés aux situations d’urgence supérieur ou égale à 3 000 000 FCFA)","c":0.7,"p":3,"f":1,"r":"< 50% = 0\nEntre 50 et 69% = 1\n> 69% = 3","x":[["bt",50.0,69.0,1],["lt",50.0,0,0],["gt",69.0,0,3]],"e":"Numérateur : Nombre de Zone Sanitaire disposant de fonds pour la riposte aux situations d’urgence (ou d’une ligne budgétaire pour des fonds consacrés aux situations d’urgence supérieur ou égale à 3 000 000 FCFA)\nDénominateur : Nombre de Zone Sanitaire\nDemander la bonne version du PTA de l’année et voir le montant prévu pour la gestion des situations d’urgence ( recherche active, investigation, validation des données de surveillance, formation du personnel en surveillance, etc)"},{"n":21,"t":"Proportion d'hôpitaux (HZ, CHD, CHU) disposant de réactifs pour les diagnostics de laboratoire pour la confirmation des MPE (méningites, cholera)","c":0.7,"p":5,"f":1,"r":"< 50% = 0\nEntre 50 et 69% = 2\n> 69% = 5","x":[["bt",50.0,69.0,2],["lt",50.0,0,0],["gt",69.0,0,5]],"e":"Numérateur : nombre d'hôpitaux (CHD, CHU) disposant de réactifs pour les diagnostics de laboratoire pour la confirmation des MPE (méningites, choléra) = utiliser les fiches de stock ou base de gestion pour vérifier les intrants disponibles\n\nDénominateur : Nombre total d'hôpitaux = considérer les CHD, CHU"},{"n":22,"t":"Proportion d’épidémies confirmées pour lesquelles une riposte a été organisée","c":0.8,"p":5,"f":1,"r":"< 50% = 0\nEntre 50 et 79% = 2\n> 79% = 5","x":[["bt",50.0,79.0,2],["lt",50.0,0,0],["gt",79.0,0,5]],"e":"Numérateur : Le nombre d’épidémies confirmées pour lesquelles une riposte a été organisée= décompter dans la base des événements les épidémies et vérifier celles pour lesquelles une riposte est organisée. Vérifier l’effectivité de la riposte dans les rapports de riposte, ou rapports de gestion de l’épidémie, rapport d’investigation, SitRep \nDénominateur : Le nombre d’épidémies confirmées dans la zone sanitaire= décompter dans la base des événements les épidémies confirmées"}]},{"o":"Objectif 6: Mettre en place un mécanisme de suivi et évaluation de la performance de la surveillance épidémiologique à tous les niveaux","i":[{"n":23,"t":"Proportion de maladies prioritaires pour lesquelles un graphique linéaire existe à la DDS","c":0.8,"p":3,"f":1,"r":"< 50% = 0\nEntre 50 et 79% = 1\n> 79% = 3","x":[["bt",50.0,79.0,1],["lt",50.0,0,0],["gt",79.0,0,3]],"e":"Numérateur : Le nombre de maladies prioritaires pour lesquelles un graphique linéaire existe= vérifier les function nw(n){const a={id:Date.now(),o:S.u?.user,n,dep:'',zone:'',date:new Date().toISOString().slice(0,10),ev:'',v:{},x:{},it:{}};S.e.push(a);S.cur=a.id;sv();draw()}
function del(){const a=cur();if(!a||!confirm('Supprimer cette évaluation ?'))return;S.e=S.e.filter(b=>b!==a);S.cur=S.e[0]?.id||null;ss();draw()}
function sc(x,v){if(v==null||!isFinite(v)||!x.length)return null;
 if(x.some(a=>a[0]=='eq'&&v==a[1]))return x.find(a=>a[0]=='eq'&&v==a[1])[3];
 for(const a of x)if(a[0]=='bt'&&v>=a[1]&&v<=a[2])return a[3];
 for(const a of x.filter(a=>a[0]=='gt'||a[0]=='ge').sort((a,b)=>b[1]-a[1]))if(a[0]=='ge'?v>=a[1]:v>a[1])return a[3];
 const l=x.filter(a=>a[0]=='lt').sort((a,b)=>a[1]-b[1]);for(const a of l)if(v<a[1])return a[3];
 return l.length?l[l.length-1][3]:0}
function calc(a,i){const r=a.v[i.n]||{};if(r.na)return{na:1};const n=parseFloat(r.n),d=parseFloat(r.d),vs=[];if(d>0&&isFinite(n))vs.push(n/d*(i.f?100:1));const f=a.fm&&a.fm[i.n];if(f)vs.push(f.m);const v=vs.length?vs.reduce((s,x)=>s+x,0)/vs.length:null;return{v,s:sc(i.x,v)}}
function fagg(a){const F=(S.fi||[]).filter(f=>nm2(f.z)==nm2(a.zone)),fm={};D.ZS.obj.forEach(o=>o.i.forEach(i=>{const vs=[];F.forEach(f=>{if(!hasMod(f.t,i.n))return;const r=f.v&&f.v[i.n];if(!r||r.na)return;const n=parseFloat(r.n),d=parseFloat(r.d);if(d>0&&isFinite(n))vs.push(n/d*(i.f?100:1))});if(vs.length)fm[i.n]={m:vs.reduce((s,x)=>s+x,0)/vs.length,k:vs.length}}));a.fm=fm;a.fc={CS:F.filter(f=>f.t=='CS').length,PRIVE:F.filter(f=>f.t=='PRIVE').length,HOP:F.filter(f=>f.t=='HOP').length}}
function fcard(a){const c=a.fc||{CS:0,PRIVE:0,HOP:0},ok=(n,m)=>n>=m?'✔':'⏳';return `<div class="card"><b>Formations sanitaires évaluées</b><div class="hint" style="margin-top:4px">${ok(c.CS,5)} Publiques : ${c.CS} / 5 minimum · ${ok(c.PRIVE,3)} Privées : ${c.PRIVE} / 3 minimum · Hôpitaux : ${c.HOP} (tous ceux de la zone)</div><p style="margin:8px 0 0"><a href="formations.html"><button class="p">Saisir les fiches des formations sanitaires</button></a></p></div>`}
const fl=(a,i)=>{const f=a.fm&&a.fm[i.n];return f?`<div class="hint" style="margin-top:6px">Moyenne des formations sanitaires : <b>${f1(f.m)}${i.f?' %':''}</b> (${f.k} fiche${f.k>1?'s':''})</div>`:''}
function pond(a){const o=D[a.n].obj.map(ob=>{let N=0,P=0;ob.i.forEach(i=>{const c=calc(a,i);if(c.na||!i.p)return;P+=i.p;N+=c.s||0});return{t:ob.o,N,P,p:P?N/P*100:null}});
 const N=o.reduce((s,x)=>s+x.N,0),P=o.reduce((s,x)=>s+x.P,0);return{o,N,P,g:P?N/P*100:null}}
const f1=x=>x==null||!isFinite(x)?'—':(Math.round(x*10)/10).toString().replace('.',',');
const cb=i=>i.c<=1?f1(i.c*100)+' %':esc(i.c);
function banner(){const a=cur(),p=pond(a);return `<div class="perf"><div><div class="hint">Performance globale</div><b id="pg">${f1(p.g)} %</b></div><span id="pb" class="badge ${p.g>74?'ok':''}">${p.g==null?'—':p.g>74?'Bonne performance':'Performance faible'}</span><span class="hint">${p.N} / ${p.P} points</span></div>`}
function stSel(a,k,lv){const all=S.st||[],lock=S.u&&S.u.role!='admin'&&S.u.struct,my=lock?all.find(x=>nm2(x.name)==nm2(S.u.struct)):null;let opts=my&&my.n==lv?[my.name]:all.filter(x=>x.n==lv).map(x=>x.name);if(my&&my.n==lv&&!a[k]){a[k]=my.name;setTimeout(sv,0)}const v=a[k]||'';if(v&&!opts.some(x=>nm2(x)==nm2(v)))opts=opts.concat([v]);return `<label>${lv=='ZS'?'Zone sanitaire':'Département (DDS)'}<select onchange="cur().${k}=this.value;sv();lbl()"><option value="">— Choisir —</option>${opts.map(x=>`<option value="${esc(x)}" ${nm2(x)==nm2(v)?'selected':''}>${esc(x)}</option>`).join('')}</select></label>`}
function head(a){const inp=([k,l])=>`<label>${l}<input ${k=='date'?'type="date"':''} value="${esc(a[k])}" oninput="cur().${k}=this.value;sv();lbl()"></label>`;return `<div class="card id">`+(a.n=='ZS'?inp(['dep','Département'])+stSel(a,'zone','ZS'):stSel(a,'dep','DDS'))+inp(['date','Date d’évaluation'])+inp(['ev','Évaluateurs'])+`</div>`}
function vInd(a){let h=banner()+head(a)+(a.n=='ZS'?fcard(a):'');D[a.n].obj.forEach(ob=>{h+=`<div class="obj"><span>${esc(ob.o)}</span></div>`;ob.i.forEach(i=>{const r=a.v[i.n]||{};h+=`<div class="card ic ${r.na?'na':''}" id="c${i.n}"><div class="ih"><b>${i.n}.</b> ${esc(i.t)}${a.n=='ZS'&&LV[i.n]?` <span class="hint">· ${LV[i.n].join(', ')}</span>`:''}</div><div class="ig"><label>Numérateur<input type="number" step="any" value="${esc(r.n)}" oninput="ch(${i.n},'n',this.value)"></label><label>Dénominateur<input type="number" step="any" value="${esc(r.d)}" oninput="ch(${i.n},'d',this.value)"></label><div class="o">Cible<b>${cb(i)}</b></div><div class="o">Valeur<b id="v${i.n}">—</b></div><div class="o">Score<b><span id="s${i.n}">—</span> / ${i.p||'—'}</b></div></div><label class="na"><input type="checkbox" ${r.na?'checked':''} onchange="ch(${i.n},'na',this.checked)"> Non applicable</label><label style="margin-top:6px">Commentaire de l’équipe<input value="${esc(r.c)}" oninput="ch(${i.n},'c',this.value)"></label>${a.n=='ZS'?fl(a,i):''}<div class="rule">${esc(i.r)}</div><details><summary>Collecte et calcul</summary><div style="white-space:pre-line">${esc(i.e)}</div></details></div>`})});return h}
function ch(n,k,v){const a=cur();(a.v[n]=a.v[n]||{})[k]=v;sv();upd()}
function upd(){const a=cur();if(!a)return;D[a.n].obj.forEach(o=>o.i.forEach(i=>{const c=calc(a,i),e=$('v'+i.n);if(!e)return;e.textContent=c.na?'NA':f1(c.v)+(c.v!=null&&i.f?' %':'');$('s'+i.n).textContent=c.na?'—':c.s==null?'—':c.s;$('c'+i.n).classList.toggle('na',!!c.na)}));const p=pond(a);if($('pg')){$('pg').textContent=f1(p.g)+' %';$('pb').textContent=p.g==null?'—':p.g>74?'Bonne performance':'Performance faible';$('pb').className='badge '+(p.g>74?'ok':'')}}
const SRC=['Fiche de notification','Rapport hebdomadaire CSE','Base SIMR','DHIS2'],COL=['Cas SIMR','Décès maternels','Décès néonatals'];
const tot=(a,s)=>[0,1,2].reduce((t,c)=>t+(parseFloat(a.x[s+'_'+c])||0),0);
const disc=(a,s,c)=>{const g=k=>c==3?tot(a,k):parseFloat(a.x[k+'_'+c])||0,x=g(s),y=g(s+1);return x?Math.abs((x-y)/x*100):null};
function vExa(a){let h=banner()+head(a)+`<div class="card w"><table><tr><th>Source</th>${COL.map(c=>`<th>${c}</th>`).join('')}<th>Total</th></tr>`;SRC.forEach((s,k)=>{h+=`<tr><td>${s}</td>${[0,1,2].map(c=>`<td><input type="number" min="0" value="${esc(a.x[k+'_'+c])}" oninput="cx('${k}_${c}',this.value)"></td>`).join('')}<td id="t${k}">${tot(a,k)}</td></tr>`});h+=`</table></div><div class="card w"><b>Discordance (%)</b><table><tr><th>Comparaison</th>${COL.map(c=>`<th>${c}</th>`).join('')}<th>Total</th></tr>`;['Fiche et rapport CSE','Rapport CSE et base SIMR','Base SIMR et DHIS2'].forEach((l,k)=>{h+=`<tr><td>${l}</td>${[0,1,2,3].map(c=>`<td id="d${k}_${c}">${f1(disc(a,k,c))}</td>`).join('')}</tr>`});return h+`</table><p class="hint">Cas SIMR : choléra, méningite, fièvre jaune, tétanos néonatal, PFA, rougeole, shigellose, rage, etc. (17 maladies de la liste).</p></div>`}
function cx(k,v){const a=cur();a.x[k]=v;sv();for(let s=0;s<4;s++)$('t'+s).textContent=tot(a,s);for(let k=0;k<3;k++)for(let c=0;c<4;c++)$('d'+k+'_'+c).textContent=f1(disc(a,k,c))}
function vPon(a){const p=pond(a);return banner()+head(a)+`<div class="card w"><table><tr><th>Domaine évalué</th><th>N</th><th>D</th><th>%</th><th></th></tr>`+p.o.map(o=>`<tr><td>${esc(o.t)}</td><td>${o.N}</td><td>${o.P}</td><td>${f1(o.p)}</td><td><div class="bar2"><i style="width:${Math.min(100,o.p||0)}%"></i></div></td></tr>`).join('')+`<tr><th>Performance globale</th><th>${p.N}</th><th>${p.P}</th><th>${f1(p.g)}</th><th></th></tr></table><p class="hint">N = score obtenu, D = score plafond des indicateurs applicables. Seuil de bonne performance : supérieur à 74 %.</p></div>`}
function vInt(a){return head(a)+(a.itU?`<div class="card" style="background:#e8f6f1">Données reçues via le formulaire intrants le ${new Date(a.itU).toLocaleString('fr-FR')}${a.itBy?' · '+esc(a.itBy):''}. Un nouvel envoi du formulaire pour cette structure remplace ces valeurs.</div>`:'')+`<div class="card"><label>Rechercher un intrant<input id="q" oninput="fi()"></label></div><div class="card w"><table id="ti"><tr><th>N°</th><th>Intrant</th><th>Stock dispo.</th><th>Péremption</th><th>Besoin exprimé</th></tr>`+D.IN.map((n,i)=>{const r=a.it[i]||{};return `<tr><td>${i+1}</td><td>${esc(n)}</td><td><input type="number" value="${esc(r.s)}" oninput="ci(${i},'s',this.value)"></td><td><input type="date" value="${esc(r.p)}" oninput="ci(${i},'p',this.value)"></td><td><input type="number" value="${esc(r.b)}" oninput="ci(${i},'b',this.value)"></td></tr>`}).join('')+`</table></div>`}
function ci(i,k,v){const a=cur();(a.it[i]=a.it[i]||{})[k]=v;sv()}
function fi(){const q=$('q').value.toLowerCase();document.querySelectorAll('#ti tr:nth-child(n+2)').forEach(r=>r.style.display=r.children[1].textContent.toLowerCase().includes(q)?'':'none')}
function lbl(){const a=cur(),o=$('sel').options[$('sel').selectedIndex];if(o)o.textContent=nm(a)}
const nm=a=>(a.n=='ZS'?'Zone — '+(a.zone||'sans nom'):'DDS — '+(a.dep||'sans nom'))+' · '+a.date+(S.u?.role=='admin'&&a.o?' · '+a.o:'');
function draw(){document.querySelectorAll('.bar button.p,.bar button.d').forEach(b=>b.style.display=(S.u&&S.u.role!='admin'&&S.u.struct)?'none':'');$('sel').innerHTML=S.e.map(a=>`<option value="${a.id}" ${a.id==S.cur?'selected':''}>${esc(nm(a))}</option>`).join('');
 $('tabs').innerHTML=TABS.concat(S.u?.role=='admin'?[['adm','Administration']]:[]).map(([k,l])=>`<button class="${S.tab==k?'on':''}" onclick="S.tab='${k}';ss();draw()">${l}</button>`).join('');
 if(S.tab=='adm'&&S.u?.role!='admin')S.tab='ind';const a=cur();if(!a&&S.tab!='adm'){$('m').innerHTML='<div class="empty">Aucune évaluation.<br>Créez une évaluation de <b>Zone sanitaire</b> ou de <b>DDS</b> avec les boutons ci-dessus.</div>';return}
 $('m').innerHTML={ind:vInd,exa:vExa,pon:vPon,int:vInt,adm:vAdm}[S.tab](a);upd()}
$('sel').onchange=e=>{S.cur=+e.target.value;ss();draw()};
function vAdm(){setTimeout(lu,0);const rows=S.e.map(a=>{const p=pond(a);return `<tr><td>${esc(a.o)}</td><td>${a.n}</td><td>${esc(a.n=='ZS'?a.zone:a.dep)}</td><td>${esc(a.date)}</td><td>${f1(p.g)}</td><td><button onclick="S.cur=${a.id};S.tab='ind';ss();draw()">Ouvrir</button></td></tr>`}).join('');
return `<div class="card w"><b>Toutes les évaluations (${S.e.length})</b><table><tr><th>Compte</th><th>Niveau</th><th>Structure</th><th>Date</th><th>Perf. %</th><th></th></tr>${rows}</table><p><button class="p" onclick="exAll()">Exporter tout (Excel)</button> <button onclick="pull()">Actualiser</button></p></div><div class="card"><b>Formulaire intrants (lien à partager)</b><p class="hint">Un compte intrants est rattaché à une structure (champ « Structure rattachée » du compte) : l’agent se connecte et envoie, sans choisir. Les données arrivent dans l’onglet Intrants de l’évaluation de cette structure, chez l’équipe concernée.</p><input id="il" readonly onclick="this.select()" style="width:100%" value="${esc(location.href.replace(/[#?].*$/,'').replace(/[^/]*$/,'')+'intrants.html')}"><p><button onclick="navigator.clipboard&&navigator.clipboard.writeText($('il').value);alert('Lien copié')">Copier le lien</button></p></div><div class="card"><b>Structures (liste de référence)</b><div class="hint">${(S.st||[]).length?(S.st||[]).map((x,i)=>`<span style="display:inline-block;margin:2px 6px 2px 0">${x.n} — ${esc(x.name)} <a href="#" onclick="ds(${i});return false">✕</a></span>`).join(''):'Aucune structure pour le moment.'}</div><label>Niveau<select id="sn"><option value="ZS">Zone sanitaire</option><option value="DDS">DDS</option></select></label><label>Noms (un par ligne)<textarea id="stn" rows="4" style="width:100%"></textarea></label><p><button class="p" onclick="as_()">Ajouter à la liste</button></p><p class="hint">Cette liste est la clé de rattachement : comptes, évaluations et formulaire intrants l’utilisent. Elle se modifie aussi dans l’onglet « Structures » du Sheet.</p></div><div class="card"><b>Comptes</b><div id="us" class="hint">Chargement…</div><div class="id" style="margin-top:8px"><label>Identifiant<input id="nu" autocapitalize="none"></label><label>Mot de passe<input id="np" placeholder="saisir ou générer"></label><label>Nom affiché<input id="nl"></label><label>Structure rattachée <span class="hint">(clé de rattachement ; vide pour l’administrateur)</span><select id="ns"><option value="">— aucune —</option>${(S.st||[]).map(x=>`<option value="${esc(x.name)}">${x.n} — ${esc(x.name)}</option>`).join('')}</select></label><label>Rôle<select id="nr"><option value="acteur">Acteur</option><option value="admin">Administrateur</option><option value="intrants">Formulaire intrants seulement</option></select></label></div><p><button onclick="$('np').value=gp()">Générer un mot de passe</button> <button class="p" onclick="au()">Créer / réinitialiser le compte</button></p><p class="hint">Les comptes et mots de passe apparaissent aussi dans l’onglet « Comptes » du Google Sheet, où vous pouvez les modifier directement. <a href="https://docs.google.com/spreadsheets/d/1d2Om1Ay4yHxzy8HvQ2am42LvkMcJmu010oHbuZRHWGs/edit?gid=1524994788#gid=1524994788" target="_blank" rel="noopener">Ouvrir le Google Sheet</a></p></div>`}
async function lu(){const j=await api({a:'users'});if($('us'))$('us').innerHTML=j.ok?j.u.map((x,i)=>`<div style="display:flex;gap:6px;align-items:center;padding:3px 0;flex-wrap:wrap"><span style="flex:1;min-width:160px">${esc(x[0])} (${esc(x[1])}) — ${esc(x[2])}${x[3]?' · '+esc(x[3]):''}</span><button onclick="ru(${i})">Nouveau mot de passe</button><button class="d" onclick="du(${i})">Supprimer</button></div>`).join(''):esc(j.err||'');if(j.ok)window.UL=j.u}
async function as_(){const names=$('stn').value.split('\n');const j=await api({a:'addStruct',n:$('sn').value,names});alert(j.ok?j.added+' structure(s) ajoutée(s)':j.err);if(j.ok){await pull();draw()}}
async function ds(i){const x=(S.st||[])[i];if(!x||!confirm('Retirer « '+x.name+' » de la liste ? Les comptes et évaluations existants ne sont pas supprimés.'))return;const j=await api({a:'delStruct',n:x.n,name:x.name});alert(j.ok?'Structure retirée':j.err);if(j.ok){await pull();draw()}}
function gp(){const c='abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';const a=crypto.getRandomValues(new Uint32Array(8));for(const n of a)s+=c[n%c.length];return s}
function ru(i){const x=UL[i];$('ns').value=x[3]||'';$('nu').value=x[0];$('nl').value=x[2];$('nr').value=x[1];$('np').value=gp();$('np').focus()}
async function du(i){const x=UL[i];if(!confirm('Supprimer le compte « '+x[0]+' » ? Ses évaluations restent dans le Google Sheet.'))return;const j=await api({a:'delUser',nu:x[0]});alert(j.ok?'Compte supprimé':j.err);if(j.ok)lu()}
async function cp(){const op=prompt('Ancien mot de passe :');if(op===null)return;const np=prompt('Nouveau mot de passe (6 caractères minimum) :');if(np===null)return;const j=await api({a:'chpass',op,np});alert(j.ok?'Mot de passe modifié':j.err)}
async function au(){const j=await api({a:'addUser',nu:$('nu').value.trim(),np:$('np').value,nl:$('nl').value,nr:$('nr').value,ns:$('ns').value.trim()});alert(j.ok?'Compte enregistré. Mot de passe : '+$('np').value:j.err);if(j.ok){$('np').value='';$('ns').value='';lu()}}
function exAll(){const A=[['Compte','Niveau','Structure','Département','Date','Évaluateurs','Perf. globale %','N','D']],B=[['Compte','Structure','Domaine','N','D','%']];
 S.e.forEach(a=>{const p=pond(a),s=a.n=='ZS'?a.zone:a.dep;A.push([a.o,a.n,s,a.dep,a.date,a.ev,p.g==null?'':Math.round(p.g*10)/10,p.N,p.P]);p.o.forEach(o=>B.push([a.o,s,o.t,o.N,o.P,o.p==null?'':Math.round(o.p*10)/10]))});
 const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(A),'EVALUATIONS');XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(B),'DOMAINES');XLSX.writeFile(wb,'Evaluations_centralisees.xlsx')}
function ex(){const a=cur();if(!a)return;const wb=XLSX.utils.book_new(),I=[['N°','Objectif','Indicateur','Numérateur','Dénominateur','Cible','Valeur atteinte','Score plafond','Score obtenu','Commentaire']];
 D[a.n].obj.forEach(o=>o.i.forEach(i=>{const r=a.v[i.n]||{},c=calc(a,i);I.push([i.n,o.o,i.t,r.n??'',r.d??'',cb(i),c.na?'NA':c.v==null?'':Math.round(c.v*10)/10,i.p||'',c.na?'NA':c.s??'',r.c||''])}));
 XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(I),'INDICATEURS');
 const E=[['Source',...COL,'Total']];SRC.forEach((s,k)=>E.push([s,...[0,1,2].map(c=>a.x[k+'_'+c]??''),tot(a,k)]));['Fiche/CSE','CSE/SIMR','SIMR/DHIS2'].forEach((l,k)=>E.push(['Discordance '+l+' (%)',...[0,1,2,3].map(c=>{const d=disc(a,k,c);return d==null?'':Math.round(d*10)/10})]));
 XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(E),'EXACTITUDE');
 const p=pond(a),P=[['Domaine','N','D','%']].concat(p.o.map(o=>[o.t,o.N,o.P,o.p==null?'':Math.round(o.p*10)/10]),[['Performance globale',p.N,p.P,p.g==null?'':Math.round(p.g*10)/10]]);
 XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(P),'PONDERATION');
 const T=[['N°','Intrant','Stock dispo.','Péremption','Besoin exprimé']];D.IN.forEach((n,i)=>{const r=a.it[i]||{};T.push([i+1,n,r.s??'',r.p??'',r.b??''])});
 XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(T),'INTRANTS');
 XLSX.writeFile(wb,'Evaluation_'+a.n+'_'+(a.zone||a.dep||'structure').replace(/\W+/g,'_')+'_'+a.date+'.xlsx')}
if(!S.cur&&S.e[0])S.cur=S.e[0].id;gate();draw();if(API&&S.u){startSync();pull()};
</script></body></html>
